<!DOCTYPE html>

<title>HNBC 内测开放公告 · 海纳柏舛</title>
<style>
  :root{ --primary:#ff8a00; --primary-2:#ff9d2e; --ink:#1a1d24; --ink-2:#5b6270; --bg:#faf7f2; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;padding:48px 20px}
  .wrap{max-width:760px;margin:0 auto;background:#fff;border-radius:20px;padding:40px;box-shadow:0 18px 50px rgba(15,23,42,.08)}
  .badge{display:inline-block;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:13px;font-weight:700;padding:5px 14px;border-radius:999px;margin-bottom:18px}
  h1{font-size:30px;font-weight:900;margin-bottom:10px}
  .sub{color:var(--ink-2);font-size:14px;margin-bottom:28px}
  h2{font-size:20px;margin:28px 0 12px}
  p{margin:12px 0;color:#2a2e38}
  ul{padding-left:22px;margin:12px 0}
  li{margin:8px 0}
  .footer{margin-top:36px;padding-top:20px;border-top:1px solid #eee;color:var(--ink-2);font-size:13px}
  a{color:var(--primary);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">官方公告</span>
    <h1>HNBC 内测开放公告</h1>
    <div class="sub">海纳柏舛 · 2026-08-05</div>

    <p>海纳柏舛社区（HNBC）内测现已正式开放！本次内测包含三大模块，欢迎抢先体验并反馈建议。</p>

    <h2>内测包含</h2>
    <ul>
      <li><b>论坛</b>：自由发帖、问题反馈、招新交流</li>
      <li><b>公告</b>：官方通知与版本动态集中展示</li>
      <li><b>个人中心</b>：资料编辑与发帖记录</li>
    </ul>

    <h2>注意事项</h2>
    <ul>
      <li>内测期间数据可能不定期重置，请勿发布重要永久内容。</li>
      <li>遇到问题请走「问题反馈」版块，或社区内的 GitHub Issue 入口。</li>
      <li>招新投递请见「招新板块」的邮箱入口。</li>
    </ul>

    <p>感谢每一位体验官，海纳百川，柏舛同行。</p>

    <div class="footer">返回 <a href="../community.html">HNBC 社区</a> · 查看 <a href="../docs.html">全部公告</a></div>
  </div>
</body>
</html>
