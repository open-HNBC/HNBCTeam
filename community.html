<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<script src="json/domain-lock.js"></script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HNBC 社区 · 海纳柏舛</title>
<link rel="icon" href="tpzy/n.png" />
<script>
/* 设备类型判定：与顶部导航栏同标准——视窗宽度 ≤ 900px（顶部显示三条杠时）即手机 = mobile 走 B 套(左药丸+右球)；
   否则 desktop 走 A 套(单药丸)。用 <html data-device> 让两套 CSS 完全互斥，杜绝重叠。 */
(function(){
  function syncDevice(){
    var m = window.innerWidth <= 900;
    document.documentElement.setAttribute('data-device', m ? 'mobile' : 'desktop');
  }
  syncDevice();
  window.addEventListener('resize', syncDevice);
  window.addEventListener('orientationchange', syncDevice);
})();
</script>
<style>
:root{
  --primary:#ff8a00; --primary-2:#ff9d2e; --accent:#ffb259;
  --ink:#20242e; --ink-2:#4a5160; --ink-3:#6b7280; --muted:#8a93a3;
  --line:rgba(20,24,33,.10);
  --card:rgba(255,255,255,.72); --card-2:rgba(255,255,255,.55);
  --glass-1:rgba(255,255,255,.55); --glass-brd:rgba(255,255,255,.65);
  --glass-2:rgba(255,255,255,.30); --glass-3:rgba(255,255,255,.12);
  --glass-glow:rgba(255,255,255,.55);
  --modal-bg:rgba(255,255,255,.42);
  --input-bg:rgba(255,255,255,.82);
  --bg-overlay:rgba(245,244,240,.82);
  --overlay:rgba(255,253,249,.45); /* 与首页一致：顶部蒙版，使透明导航栏读成实色顶栏 */
  --bg-glow:radial-gradient(1200px 600px at 15% -10%,rgba(255,138,0,.18),transparent 60%),radial-gradient(1000px 500px at 100% 0%,rgba(255,160,60,.12),transparent 55%);
  --radius:20px;
  --maxw:1200px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --ink-4:#6b7280;
  --text-mute:#9aa0a6;
  --glass-brd2:rgba(255,255,255,.32);
  --nav-bg-s:rgba(255,255,255,.72);
  --nav-brd-s:rgba(255,255,255,.55);
}
[data-theme="dark"]{
  --ink:#f3f5f9; --ink-2:#c4ccd8; --ink-3:#98a2b3; --muted:#8b95a7;
  --line:rgba(255,255,255,.12);
  --card:rgba(20,24,33,.55); --card-2:rgba(20,24,33,.40);
  --glass-1:rgba(255,255,255,.10); --glass-brd:rgba(255,255,255,.16);
  --glass-2:rgba(255,255,255,.06); --glass-3:rgba(255,255,255,.03);
  --glass-glow:rgba(255,255,255,.10);
  --modal-bg:rgba(22,28,42,.34);
  --input-bg:rgba(0,0,0,.42);
  --bg-overlay:rgba(8,10,16,.82);
  --overlay:rgba(0,0,0,.55); /* 与首页暗色蒙版一致 */
  --bg-glow:radial-gradient(1200px 600px at 15% -10%,rgba(255,138,0,.22),transparent 60%),radial-gradient(1000px 500px at 100% 0%,rgba(255,160,60,.14),transparent 55%);
  --ink-4:rgba(255,255,255,.45);
  --text-mute:rgba(255,255,255,.5);
  --glass-brd2:rgba(255,255,255,.12);
  --nav-bg-s:rgba(12,15,23,.6);
  --nav-brd-s:rgba(255,255,255,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{margin:0;padding:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink); min-height:100vh; line-height:1.6;
  background:url("tpzy/bj.jpg") center/cover fixed no-repeat;
  transition:color .3s ease;
}
body::before{content:"";position:fixed;inset:0;background:var(--overlay);z-index:-2;transition:background .3s ease;}
body::after{content:"";position:fixed;inset:0;background:var(--bg-glow);z-index:-1;pointer-events:none;}

.glass{
  background:linear-gradient(135deg,var(--glass-1),var(--glass-2));
  -webkit-backdrop-filter:blur(18px) saturate(150%);
  backdrop-filter:blur(18px) saturate(150%);
  border:1px solid var(--glass-brd);
  border-radius:var(--radius);
  box-shadow:0 12px 34px rgba(0,0,0,.20), inset 0 1px 0 var(--glass-glow);
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

#navbar{
  position:fixed; top:0; left:0; right:0; z-index:1000;
  padding:18px 0;
  background:transparent;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  border-bottom:1px solid transparent;
  box-shadow:none;
  transition:all .4s var(--ease);
}
#navbar.scrolled{
  padding:12px 0;
  background:var(--nav-bg-s);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  border-bottom:1px solid var(--nav-brd-s);
  box-shadow:
    0 8px 30px rgba(0,0,0,.12),
    inset 0 1px 0 rgba(255,255,255,.4);
}
/* 菜单打开时关掉 navbar 自身模糊，避免子级弹层 backdrop-filter 失效 */
#navbar.menu-open{ backdrop-filter:none; -webkit-backdrop-filter:none; }
.nav-inner{
  display:flex; align-items:center; justify-content:space-between;
}
.nav-logo{
  display:flex; align-items:center; gap:10px;
  font-weight:800; font-size:20px;
  letter-spacing:.02em;
  text-decoration:none; color:var(--primary);
}
.nav-logo .brand-text{
  font-weight:800; letter-spacing:.06em;
  background:linear-gradient(135deg, var(--primary), #ffd9a8);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.nav-logo:hover .brand-text{ filter:brightness(1.08); }

.nav-links{
  display:flex; align-items:center; gap:8px; list-style:none;
}
.nav-links a{
  text-decoration:none; position:relative;
  padding:8px 16px; font-size:15px;
  color:var(--ink-2);
  border-radius:999px;
  transition:all .3s var(--ease);
}
.nav-links a::after{
  content:""; position:absolute;
  left:50%; bottom:4px;
  width:0; height:2px;
  background:var(--primary); border-radius:2px;
  transform:translateX(-50%);
  transition:width .3s var(--ease);
}
.nav-links a:hover{ color:var(--primary); }
.nav-links a:hover::after{ width:18px; }
.nav-links a.active{
  color:var(--primary);
  font-weight:600;
}
.nav-links a.active::after{ width:18px; background:var(--primary); }

/* 语言切换 */
.lang-switcher{
  display:flex; align-items:center; gap:4px;
  padding-left:10px; margin-left:6px;
  border-left:1px solid var(--glass-brd2);
}
.lang-btn{
  padding:6px 10px; border:none; border-radius:8px;
  background:transparent; color:var(--ink-4);
  font-size:13px; font-weight:600; cursor:pointer;
  transition:all .3s var(--ease);
  font-family:var(--font-sans); line-height:1;
}
.lang-btn:hover{ color:var(--ink); background:rgba(255,255,255,.15); }
.lang-btn.active{
  color:#fff;
  background:linear-gradient(135deg, var(--primary), var(--primary-2));
  box-shadow:0 4px 12px rgba(255,138,0,.3);
}
.theme-toggle-btn{
  padding:6px 10px;font-size:13px;font-weight:600;
  color:var(--text-mute);border-radius:8px;
  transition:all .3s var(--ease);cursor:pointer;
  font-family:var(--font-sans);line-height:1;
  background:transparent;border:none;white-space:nowrap;
}
.theme-toggle-btn:hover{color:var(--primary);background:rgba(255,138,0,.12);}

/* 汉堡按钮 */
.nav-toggle{
  display:none; flex-direction:column;
  background:none; border:none; cursor:pointer;
  padding:8px; gap:5px;
}
.nav-toggle span{
  width:20px; height:2px;
  background:#fff; border-radius:2px;
  transition:all .3s var(--ease);
}
.nav-toggle.active span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.nav-toggle.active span:nth-child(2){ opacity:0; }
.nav-toggle.active span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

.container{ width:100%; max-width:var(--maxw); margin:0 auto; padding:0 32px; }

@media(max-width:900px){
  .nav-links{
    display:none;
  }
  .nav-links.open{
    display:flex;
    position:absolute;
    top:calc(100% + 14px);
    left:50%; transform:translateX(-50%);
    width:min(400px, calc(100vw - 48px));
    flex-direction:column;
    background:linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.07));
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    border:1px solid rgba(255,255,255,.18);
    border-radius:24px;
    gap:20px;
    padding:20px 4px;
    box-shadow:0 32px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.28);
    transform-origin:top center;
    animation:navMenuIn .42s var(--ease) both;
  }
  @keyframes navMenuIn{
    0%{ opacity:0; transform:translateX(-50%) translateY(-16px) scale(.92); }
    100%{ opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
  }
  .nav-links.open a{
    padding:10px 20px; border-radius:14px; text-align:center;
    font-size:18px;
  }
  .nav-links.open a:hover{ background:rgba(255,138,0,.15); color:var(--primary); }
  .nav-links.open a::after{ display:none; }
  .nav-links.open .lang-switcher{
    display:flex; justify-content:center; flex-wrap:wrap; gap:4px;
    padding:16px 0 0; margin-top:8px;
    border-top:none; border-left:none; padding-left:0; margin-left:0;
  }
  .nav-links.open .lang-switcher .lang-btn{ padding:8px 14px; font-size:16px; }
  .nav-toggle{ display:flex; }
}
@media(max-width:640px){
  .container{ padding:0 20px; }
}

.wrap{max-width:var(--maxw);margin:0 auto;padding:96px 28px 120px;}
/* P1 落地页：未登录时全屏居中展示，完全拦截后面的内容（无模糊、无透出） */
.hero{position:fixed;inset:0;z-index:125;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:linear-gradient(var(--overlay),var(--overlay)),url("tpzy/bj.jpg") center/cover fixed no-repeat,var(--bg);}
.hero[hidden]{display:none;}
.hero.hero-out{animation:heroOut .45s ease forwards;}
@keyframes heroOut{to{opacity:0;transform:scale(.98);visibility:hidden;}}
.hero-inner{max-width:780px;margin:0 auto;animation:heroIn .55s ease;}
@keyframes heroIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.hero-brand{font-size:clamp(30px,5.2vw,52px);font-weight:900;letter-spacing:.03em;line-height:1.02;margin:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 8px 34px rgba(255,138,0,.28);}
.hero-sub{font-size:clamp(16px,2.2vw,21px);font-weight:800;color:var(--primary);margin:10px 0 0;letter-spacing:.1em;}
.hero-community{font-size:clamp(13px,1.7vw,17px);font-weight:700;color:var(--ink);margin:3px 0 0;letter-spacing:.14em;}
[data-theme="dark"] .hero-community{color:#fff;}
.hero-slogan{color:var(--ink-2);font-size:15px;line-height:1.95;margin:16px auto 22px;max-width:640px;}
.hero-login{padding:12px 32px;font-size:15px;}
/* 登录后内容淡入 */
.wrap.content-in{animation:fadeUp .6s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.xianna-card h3{margin:0 0 6px;}
.xianna-card .sum{margin:0 0 4px;}

.fab{position:fixed;right:22px;bottom:96px;z-index:130;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;display:grid;place-items:center;box-shadow:0 14px 34px rgba(255,138,0,.45);transition:transform .25s,box-shadow .25s;}
.fab:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 20px 44px rgba(255,138,0,.55);}
.fab svg{width:26px;height:26px;}
.fab.hidden{display:none;}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;}
.toolbar .count{color:var(--ink-3);font-size:13px;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid transparent;font-size:14px;font-weight:600;transition:.2s;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 8px 20px rgba(255,138,0,.32);}
.btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px);}
.btn-ghost{background:var(--glass-2);border-color:var(--glass-brd);color:var(--ink-2);}
.btn-ghost:hover{color:var(--ink);}
.btn svg{width:18px;height:18px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;}
.card{padding:18px;border-radius:var(--radius);transition:.22s;cursor:pointer;display:flex;flex-direction:column;gap:10px;}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px rgba(0,0,0,.24);}
.card .tag{align-self:flex-start;font-size:11px;padding:3px 10px;border-radius:999px;font-weight:700;letter-spacing:.3px;}
.tag.announce{background:rgba(255,138,0,.18);color:var(--primary);}
.tag.discuss{background:rgba(255,178,89,.16);color:var(--accent);}
.tag.feedback{background:rgba(255,77,79,.16);color:#ff6b6b;}
.tag.recruit{background:rgba(82,196,26,.16);color:#52c41a;}
.card h3{margin:0;font-size:17px;font-weight:800;line-height:1.4;}
.card .sum{margin:0;color:var(--ink-3);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card .meta{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);}
.card .meta img{width:24px;height:24px;border-radius:50%;object-fit:cover;background:var(--glass-3);}
.card .meta .nm{color:var(--ink-2);font-weight:600;}
.card .meta .acts{margin-left:auto;display:flex;gap:14px;}
.card .meta .acts span{display:inline-flex;align-items:center;gap:4px;}
.card .meta .acts svg{width:14px;height:14px;}

.empty{text-align:center;padding:60px 20px;color:var(--ink-3);}
.empty .ic{width:64px;height:64px;margin:0 auto 14px;color:var(--ink-3);opacity:.5;}
.empty .ic svg{width:100%;height:100%;}
.skeleton{height:150px;border-radius:var(--radius);background:linear-gradient(100deg,var(--glass-2) 30%,var(--glass-3) 50%,var(--glass-2) 70%);background-size:200% 100%;animation:sh 1.2s infinite;}
@keyframes sh{to{background-position:-200% 0;}}

.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.42);-webkit-backdrop-filter:none;backdrop-filter:none;z-index:200;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
.modal-mask.show{display:flex;}
.modal.glass{background:var(--modal-bg);-webkit-backdrop-filter:blur(40px) saturate(2.6);backdrop-filter:blur(40px) saturate(2.6);border:1px solid rgba(255,255,255,.30);box-shadow:0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.40), inset 0 0 0 1px rgba(255,255,255,.06);}
/* 模态内输入框/textarea/select：实色底+内阴影,绝对不透出背景 hero */
.modal .field input,.modal .field textarea,.modal .field select,.modal .comment-form input{
  background:var(--input-bg)!important;
  border-color:rgba(255,255,255,.10);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.18);
  color:var(--ink);
}
[data-theme="light"] .modal .field input,[data-theme="light"] .modal .field textarea,[data-theme="light"] .modal .field select,[data-theme="light"] .modal .comment-form input{
  box-shadow:inset 0 1px 2px rgba(20,24,33,.06);
}
.modal{width:min(680px,100%);max-height:90vh;overflow:auto;padding:24px;border-radius:22px;margin:auto;}
.modal h2{margin:0 0 4px;font-size:22px;}
.modal .sub{color:var(--ink-3);font-size:13px;margin-bottom:16px;}
.modal .close{position:sticky;top:0;float:right;margin:-6px -6px 0 0;width:34px;height:34px;border-radius:10px;border:1px solid var(--glass-brd);background:var(--glass-2);color:var(--ink-2);font-size:18px;line-height:1;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;font-weight:600;}
.field input,.field textarea,.field select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--glass-brd);background:var(--glass-2);color:var(--ink);font-size:14px;outline:none;transition:.2s;font-family:inherit;}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(255,138,0,.18);}
.field textarea{min-height:120px;resize:vertical;}
.code-row{display:flex;gap:10px;}
.code-row input{flex:1;}
.code-row button{flex:0 0 auto;white-space:nowrap;}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px;}
.err{color:#ff6b6b;font-size:13px;margin-top:8px;min-height:18px;}
.detail-content{white-space:pre-wrap;font-size:15px;color:var(--ink-2);line-height:1.8;background:var(--glass-2);padding:16px;border-radius:14px;margin:8px 0 18px;}
.comments{border-top:1px solid var(--line);padding-top:14px;}
.comment{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.comment img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:var(--glass-3);flex-shrink:0;}
.comment .body .nm{font-size:13px;font-weight:700;color:var(--ink);}
.comment .body .ct{font-size:10px;color:var(--ink-3);margin-left:8px;}
.comment .body .tx{font-size:14px;color:var(--ink-2);margin-top:2px;white-space:pre-wrap;}
.comment-form{display:flex;gap:10px;margin-top:14px;}
.comment-form input{flex:1;padding:11px 14px;border-radius:12px;border:1px solid var(--glass-brd);background:var(--glass-2);color:var(--ink);outline:none;}
.comment-form input:focus{border-color:var(--primary);}

/* iOS 26 悬浮居中液态玻璃底部导航：桌面四合一单药丸，手机左药丸+右小球 */
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:130;display:flex;align-items:center;gap:4px;padding:8px;border-radius:999px;max-width:calc(100vw - 32px);box-shadow:0 16px 44px rgba(0,0,0,.34), inset 0 1px 0 var(--glass-glow);}
.dock::before{content:"";position:absolute;inset:0;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0));pointer-events:none;mix-blend-mode:overlay;}
/* 桌面：dock-pill 和 dock-fab 透明壳，4 个 tab 平铺进整药丸。
   注意：这里不放 background/padding/border-radius 的 !important——它们会与手机 B 套的规则抢 specificity，
   导致手机 dock-fab 的 border-radius:50% 失效、变方块。手机/桌面互斥交给各自的 [data-device] 子选择器。 */
.dock-pill,.dock-fab{display:flex;align-items:center;position:relative;}
.dock-pill{gap:4px;}
.dock-fab{gap:3px;flex-direction:column;justify-content:center;}
.dock-tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:74px;padding:9px 14px;border-radius:999px;border:none;background:transparent;color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.5px;transition:.9s;z-index:1;}
.dock-tab svg{width:24px;height:24px;transition:.25s;}
.dock-tab:hover{color:var(--ink-2);}
/* 选中态：渐变填充 + 圆形光晕向外扩散 */
/* 选中态：液态玻璃橙（不再是"土味大块橙"实心填充） */
.dock-tab.active{
  color:var(--primary);
  background:transparent;
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
  text-shadow:0 0 10px rgba(255,138,0,.5);
  /* 微发光：由内向外 100%→0% 柔和渐隐，无描边 */
  box-shadow:
    0 0 14px rgba(255,138,0,.22),
    0 0 26px rgba(255,138,0,.12),
    0 0 40px rgba(255,138,0,0);
}
/* 选中态已改为「图标+文字整体变橙 + 外发光」彻底无框：
   不再用 ::before 覆盖整个 tab 形成发光块，也不依赖 keyframe 脉冲。 */
.dock-tab.active svg,.dock-tab.active span{position:relative;z-index:1;}
.dock-tab.active svg{
  filter:drop-shadow(0 0 6px rgba(255,138,0,.55));
}
.dock-tab .dot{position:absolute;top:6px;right:14px;width:7px;height:7px;border-radius:50%;background:#ff4d4f;box-shadow:0 0 0 2px var(--glass-1);display:none;}
.dock-tab.has-dot .dot{display:block;}
/* B 套（手机，仅 [data-device="mobile"] 生效）：左药丸(论坛/公告/献纳) + 中间空 + 右球(个人)。
   与桌面 A 套完全互斥——A 套只在 [data-device="desktop"] 下显示，B 套只在 [data-device="mobile"] 下显示。
   使用 justify-content:center + width:auto 让 dock 自动收紧到内容宽度并居中。
   所有尺寸一律用 clamp() 做自适应：320px 小屏 ~ 560px 大屏自动放大。 */
[data-device="mobile"] .dock{
  gap:clamp(46px,11vw,72px);
  bottom:clamp(14px,3vw,22px);
  padding:0;
  background:transparent;
  box-shadow:none;
  width:auto;
  max-width:calc(100vw - 24px);
  justify-content:center;
  align-items:center;
}
[data-device="mobile"] .dock::before{display:none;}
/* 药丸外壳：左 padding 加到 10px、tab 间 gap 加到 6px，三个 tab 之间更通透 */
[data-device="mobile"] .dock-pill{
  display:flex;
  gap:clamp(24px,5.6vw,40px);
  padding:clamp(8px,2vw,12px) clamp(10px,2.4vw,14px);
  border-radius:999px;
  background:var(--glass-1);
  border:1px solid var(--glass-brd);
  box-shadow:0 16px 44px rgba(0,0,0,.34), inset 0 1px 0 var(--glass-glow);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  backdrop-filter:blur(20px) saturate(1.5);
}
[data-device="mobile"] .dock-pill::before{
  display:block;content:"";
  position:absolute;inset:0;border-radius:999px;
  background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0));
  pointer-events:none;mix-blend-mode:overlay;
}
/* 三个普通 tab：左右 padding 10px 让文字不顶边 + 字号 11px 自适应 */
[data-device="mobile"] .dock-tab:not(.dock-fab){
  min-width:0;flex:1 1 0;
  padding:clamp(10px,2.6vw,14px) clamp(8px,1.8vw,11px);
  font-size:clamp(10px,2.6vw,12px);
  letter-spacing:0;
}
[data-device="mobile"] .dock-tab:not(.dock-fab) svg{
  width:clamp(20px,5vw,24px);height:clamp(20px,5vw,24px);
}
/* 个人球：60~68px 自适应圆 */
[data-device="mobile"] .dock-fab{
  flex:0 0 clamp(58px,15vw,68px);
  width:clamp(58px,15vw,68px);
  height:clamp(58px,15vw,68px);
  min-width:clamp(58px,15vw,68px);
  padding:clamp(4px,1.2vw,7px) clamp(3px,.8vw,5px);
  border-radius:50%;
  background:var(--glass-1);
  border:1px solid var(--glass-brd);
  box-shadow:0 16px 44px rgba(0,0,0,.34), inset 0 1px 0 var(--glass-glow);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  backdrop-filter:blur(20px) saturate(1.5);
  color:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:.9s;
}
[data-device="mobile"] .dock-fab::before{
  display:block;content:"";
  position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0));
  pointer-events:none;mix-blend-mode:overlay;
}
[data-device="mobile"] .dock-fab span{font-size:clamp(10px,2.6vw,12px);letter-spacing:.5px;}
[data-device="mobile"] .dock-fab svg{width:clamp(22px,5.2vw,26px);height:clamp(22px,5.2vw,26px);}
[data-device="mobile"] .dock-fab.active{
  color:#fff;
  /* 液态玻璃橙（手机个人球选中态，不再是土味大块橙） */
  background:
    linear-gradient(180deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,0) 45%),
    linear-gradient(135deg, rgba(255,138,0,.32) 0%, rgba(255,138,0,.10) 100%);
  -webkit-backdrop-filter:blur(14px) saturate(1.4);
  backdrop-filter:blur(14px) saturate(1.4);
  text-shadow:0 1px 2px rgba(0,0,0,.18);
  /* 微发光：由内向外 100%→0% 柔和渐隐，无描边 */
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.28),
    0 0 8px  rgba(255,138,0,.25),
    0 0 8px  rgba(255,138,0,.25),
    0 0 18px rgba(255,138,0,.12),
    0 0 30px rgba(255,138,0,0);
}
/* 中小屏再加一道保险：380px 以下稍微压一点，避免 padding 把药丸撑出屏外 */
@media(max-width:380px){
  [data-device="mobile"] .dock-tab:not(.dock-fab){padding:8px 7px;}
}
/* 桌面 A 套：data-device=desktop 时，dock-pill 透明合并进整药丸，dock-fab 也不再独立成球 */
[data-device="desktop"] .dock-pill,.dock-fab{background:transparent!important;box-shadow:none;padding:0!important;border:none!important;border-radius:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;}
[data-device="desktop"] .dock-pill::before,[data-device="desktop"] .dock-fab::before{display:none!important;}
[data-device="desktop"] .dock-fab{flex-direction:column;justify-content:center;}

/* 个人面板 */
.profile-card .avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--glass-3);display:block;margin:0 auto 10px;border:2px solid var(--glass-brd);}
.profile-card .avatar-ph{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary-2));margin:0 auto 10px;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:800;}

.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:300;background:rgba(20,24,33,.9);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;}

@media(max-width:900px){.wrap{padding:84px 16px 90px;}}
@media(max-width:560px){.grid{grid-template-columns:1fr;}}
</style>

<script>
(function(){
  "use strict";

  /* ===== 导航栏滚动状态（始终液态玻璃，滚动更紧凑） ===== */
  var navbar = document.getElementById("navbar");
  function syncNavbar(){
    if(window.scrollY > 10) navbar.classList.add("scrolled");
    else navbar.classList.remove("scrolled");
  }
  window.addEventListener("scroll", syncNavbar, { passive:true });
  syncNavbar();

  /* ===== 移动端导航开关 ===== */
  var navbar = document.getElementById("navbar");
  var navToggle = document.getElementById("navToggle");
  var navLinks = document.getElementById("navLinks");
  navToggle.addEventListener("click", function(){
    navLinks.classList.toggle("open");
    navToggle.classList.toggle("active");
    navbar.classList.toggle("menu-open");
  });

  /* ===== 多语言（外部语言包 json/i18n/） ===== */
  window.onI18nApplied = function(lang){
    document.title = window.I18N.t("home.title");
  };
  window.I18N.init();

  /* ===== 导航栏 active 状态切换 ===== */
  var currentPage = location.pathname.split("/").pop() || "index.html";
  document.querySelectorAll(".nav-links a[data-i18n]").forEach(function(link){
    var href = link.getAttribute("href");
    if(href === currentPage) link.classList.add("active");
    else link.classList.remove("active");
  });
})();

/* ===== 主题切换：与首页一致，仅记录偏好，供其他页面生效 ===== */
(function(){
  var KEY = "naling-theme";
  var btn = document.getElementById("themeToggle");
  if(!btn) return;
  function getStored(){
    try { return localStorage.getItem(KEY) || "dark"; } catch(e){ return "dark"; }
  }
  function setStored(v){ try { localStorage.setItem(KEY, v); } catch(e){} }
  function updateLabel(){
    var isDark = getStored() === "dark";
    // 文案显示"目标模式"：当前为暗则提示可切到明亮，反之亦然
    btn.textContent = window.I18N.t(isDark ? "theme.light" : "theme.dark");
  }
  // 社区页跟随存储的偏好（默认深色），点击记录偏好
  document.documentElement.setAttribute("data-theme", getStored());
  updateLabel();
  btn.addEventListener("click", function(){
    var next = getStored() === "dark" ? "light" : "dark";
    setStored(next);
    document.documentElement.setAttribute("data-theme", next);
    updateLabel();
  });
  window.addEventListener("i18n:applied", updateLabel);
})();
</script>
